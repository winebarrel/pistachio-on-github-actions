name: pistachio

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xeo pipefail {0}

permissions:
  contents: read
  pull-requests: write

jobs:
  pistachio:
    runs-on: codebuild-gha-runner-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      PISTA_MANAGE_ROUTINE: "1"
      # apply only: reject a concurrent apply against the same database
      # (plan ignores it)
      PISTA_EXCLUSIVE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install pistachio
        env:
          PISTACHIO_VERSION: 1.59.0
        run: |
          curl -sSfL --retry 3 -o pistachio.deb \
            "https://github.com/winebarrel/pistachio/releases/download/v${PISTACHIO_VERSION}/pistachio_${PISTACHIO_VERSION}_amd64.deb"
          dpkg -i pistachio.deb
          pista --version

      - uses: winebarrel/lastcmt@v0.7.0
        if: github.event_name == 'pull_request'

      # PISTA_CONN_STR / PISTA_PASSWORD come from the CodeBuild project.
      # Write the output under RUNNER_TEMP: a *.sql file in the workspace
      # would be picked up by the glob below.
      - name: pistachio plan
        if: github.event_name == 'pull_request'
        run: pista plan *.sql | tee "${RUNNER_TEMP}/plan.sql"

      - name: Comment plan
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '```sql'
            cat "${RUNNER_TEMP}/plan.sql"
            echo '```'
          } | lastcmt ${{ github.event.number }}

      - name: pistachio apply
        if: github.event_name == 'push'
        run: pista apply *.sql | tee "${RUNNER_TEMP}/apply.sql"

      # Find the pull request the merge commit came from and write the result
      # there. A direct push to main has no pull request, so do nothing.
      - name: Comment apply result
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          {
            echo 'merged'
            echo '```sql'
            cat "${RUNNER_TEMP}/apply.sql"
            echo '```'
          } | gh pr comment "$pr" --body-file -
