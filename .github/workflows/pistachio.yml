name: pistachio

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xeo pipefail {0}

permissions:
  contents: read
  pull-requests: write

jobs:
  pistachio:
    runs-on: codebuild-gha-runner-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      PISTA_MANAGE_ROUTINE: "1"
      # apply only: reject a concurrent apply against the same database
      # (plan ignores them)
      PISTA_EXCLUSIVE: "1"
      QREV_EXCLUSIVE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install pistachio
        env:
          PISTACHIO_VERSION: 1.59.0
        run: |
          curl -sSfL --retry 3 -o pistachio.deb \
            "https://github.com/winebarrel/pistachio/releases/download/v${PISTACHIO_VERSION}/pistachio_${PISTACHIO_VERSION}_amd64.deb"
          dpkg -i pistachio.deb
          pista --version

      - name: Install qrev
        env:
          QREV_VERSION: 0.7.0
        run: |
          curl -sSfL --retry 3 -o qrev.deb \
            "https://github.com/winebarrel/qrev/releases/download/v${QREV_VERSION}/qrev_${QREV_VERSION}_amd64.deb"
          dpkg -i qrev.deb
          qrev --version

      # The history table is already there. Kept for whoever builds this from
      # scratch: run it once, then comment it out again.
      # - name: qrev init
      #   run: qrev init

      - uses: winebarrel/lastcmt@v0.7.0
        if: github.event_name == 'pull_request'

      # PISTA_CONN_STR / PISTA_PASSWORD come from the CodeBuild project.
      # Keep the output out of tables/, which is what the glob reads.
      - name: pistachio plan
        if: github.event_name == 'pull_request'
        run: pista plan tables/*.sql | tee "${RUNNER_TEMP}/pistachio-plan.sql"

      - name: qrev plan
        if: github.event_name == 'pull_request'
        run: qrev plan 'data/*.sql' | tee "${RUNNER_TEMP}/qrev-plan.txt"

      # One comment per tool, each under its own lastcmt key so that posting
      # one does not minimize the other.
      - name: Comment plan
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## pistachio plan'
            echo '```sql'
            cat "${RUNNER_TEMP}/pistachio-plan.sql"
            echo '```'
          } | lastcmt -k pistachio ${{ github.event.number }}
          {
            echo '## qrev plan'
            echo '```'
            cat "${RUNNER_TEMP}/qrev-plan.txt"
            echo '```'
          } | lastcmt -k qrev ${{ github.event.number }}

      - name: pistachio apply
        if: github.event_name == 'push'
        run: pista apply tables/*.sql | tee "${RUNNER_TEMP}/pistachio-apply.sql"

      # Data migrations run after the schema they depend on.
      - name: qrev apply
        if: github.event_name == 'push'
        run: qrev apply 'data/*.sql' | tee "${RUNNER_TEMP}/qrev-apply.txt"

      # Find the pull request the merge commit came from and write the result
      # there. A direct push to main has no pull request, so do nothing.
      - name: Comment apply result
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          {
            echo 'merged'
            echo
            echo '## pistachio apply'
            echo '```sql'
            cat "${RUNNER_TEMP}/pistachio-apply.sql"
            echo '```'
            echo
            echo '## qrev apply'
            echo '```'
            cat "${RUNNER_TEMP}/qrev-apply.txt"
            echo '```'
          } | gh pr comment "$pr" --body-file -
