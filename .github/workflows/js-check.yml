name: js-check

on:
  workflow_dispatch:

jobs:
  js:
    runs-on: codebuild-gha-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: node version
        run: |
          node -v
          which node
          pwd

      - name: inline js
        run: node -e 'console.log("inline:", 1 + 1, process.version)'

      - name: write js file into workspace
        run: |
          set -x
          echo 'console.log("from file:", process.cwd())' > hello.js
          node hello.js

      - name: checkout (JavaScript action)
        uses: actions/checkout@v5

      - name: run js after checkout
        run: |
          node -e 'console.log("files:", require("fs").readdirSync(".").join(","))'

      - name: github-script (JavaScript action)
        uses: actions/github-script@v7
        with:
          script: |
            console.log("repo:", context.repo.owner + "/" + context.repo.repo)
            return 42
